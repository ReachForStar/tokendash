name: Release Linux bundles

# Publishes the Ubuntu tray app (deb + AppImage) for a release tag.
# scripts/deploy.sh runs on macOS and produces the DMG and Sparkle appcast;
# the Linux bundles are built here instead and attached to the same GitHub
# Release. Triggered by the tag push that deploy.sh performs before it marks
# the release non-draft, so the draft release already exists when this runs.
#
# workflow_dispatch re-attaches assets for an existing v* tag (e.g. after a
# failed run); it does not create releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)attach Linux assets to, e.g. v1.9.2'
        required: true
        type: string

permissions:
  contents: write   # gh release upload onto the tag's release

concurrency:
  group: release-linux-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish-linux:
    name: Build and attach deb + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # FUSE is unavailable in containers; linuxdeploy unpacks itself instead
      # of mounting.
      - name: Build deb + AppImage
        run: npm ci && npm run build:linux
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Attach assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/TokenDash_*_amd64.deb \
            src-tauri/target/release/bundle/appimage/TokenDash_*.AppImage \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: tokendash-linux-${{ steps.tag.outputs.tag }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
